server:
  port: ${SERVER_PORT:8016}

spring:
  application:
    name: campus-activity
  datasource:
    url: jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

campus:
  upload-dir: ${CAMPUS_UPLOAD_DIR:./uploads}
