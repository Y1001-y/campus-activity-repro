# S02 部署资产：Nginx 站点配置（生产参考）
# 作用：admin 静态站 + app H5 静态站 + /api 与 /uploads 反代到后端 8016。
# 关键点：SPA 子路由刷新用 try_files 回退 index.html（否则 404）；静态资源命中缓存。

upstream campus_backend {
    server 127.0.0.1:8016;
    keepalive 16;
}

# ---------- 管理后台 admin（history 路由，必须 try_files） ----------
server {
    listen 80;
    server_name admin.campus.example.com;

    root /var/www/campus-activity/admin/dist;
    index index.html;

    # SPA 路由兜底：刷新 /users、/logs 等子路由不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的静态资源强缓存，提升二次访问
    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://campus_backend;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ---------- 小程序 H5（uni-app build:h5 产物） ----------
server {
    listen 80;
    server_name h5.campus.example.com;

    root /var/www/campus-activity/app/dist/build/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://campus_backend;
        expires 7d;
        add_header Cache-Control "public";
    }
}
